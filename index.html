
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocarina of Time - N64</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #080b10;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px;
      background: #111923;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    #status {
      color: #aab7c7;
      font-size: 12px;
    }

    main {
      flex: 1;
      min-height: 0;
    }

    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <header>
    <strong>Ocarina of Time</strong>
    <span id="status">Loading emulator...</span>
  </header>

  <main>
    <div id="game"></div>
  </main>

  
<script>
  EJS_player = "#game";
  EJS_core = "n64";
  EJS_gameName = "The Legend of Zelda - Ocarina of Time";

  EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

  EJS_gameUrl = "https://github.com/FablesEnd1/Ocarina-of-Time-Web/releases/download/V1.0/oot.n64";

  EJS_startOnLoaded = true;
  EJS_color = "#176b45";

  window.addEventListener("error", function(event) {
    document.getElementById("status").textContent =
      "Error: " + (event.message || "Script failed to load");
  });

  window.addEventListener("unhandledrejection", function(event) {
    document.getElementById("status").textContent =
      "Error: " + String(event.reason);
  });

  EJS_onGameStart = function() {
    document.getElementById("status").textContent = "Game started";
  };
</script>
  
</body>
</html>
